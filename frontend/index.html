<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Antigravity ACP</title>
    <style>
      html {
        background-color: #ffffff;
        color: #1b1c1d;
      }
      html[data-theme="dark"] {
        background-color: #1a1a1a;
        color: #e8eaed;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          background-color: #1a1a1a;
          color: #e8eaed;
        }
      }
    </style>
    <script>
      (function () {
        var root = document.documentElement;
        var saved = null;
        try {
          var raw = window.localStorage.getItem("agy-acp.setup.theme");
          if (raw === "light" || raw === "dark") saved = raw;
        } catch (e) {}
        if (saved) {
          root.dataset.theme = saved;
          return;
        }
        if (root.dataset.theme === "light" || root.dataset.theme === "dark") {
          return;
        }
        try {
          var param = new URLSearchParams(window.location.search).get("theme");
          if (param === "light" || param === "dark") {
            root.dataset.theme = param;
            return;
          }
        } catch (e) {}
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          root.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
