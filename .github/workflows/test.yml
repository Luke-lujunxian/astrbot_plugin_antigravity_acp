name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sensitive pattern scan
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_sensitive.py
      - name: Byte-compile all plugin sources
        run: python -B -m compileall -q main.py agy_provider tests
      - name: Offline Python regressions
        run: python -m unittest discover -s tests -v
      - name: Setup view syntax
        run: node --check views/setup/app.js
      - name: Setup view interaction regressions
        run: node --test tests/setup.test.mjs

  release_v084:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: v0.8.4 tool policy, quota, usage & readonly builtins'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package and publish v0.8.4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version: 0.8.4' metadata.yaml
          grep -Fx 'PLUGIN_VERSION = "0.8.4"' agy_provider/_version.py
          asset=astrbot_plugin_antigravity_acp_v0.8.4.zip
          git archive --format=zip --prefix=astrbot_plugin_antigravity_acp/ -o "$asset" "$GITHUB_SHA"
          unzip -t "$asset"
          for f in index.html app.js style.css; do unzip -Z1 "$asset" | grep -Fx "astrbot_plugin_antigravity_acp/views/setup/$f"; done
          if unzip -Z1 "$asset" | grep -E '/views/setup/assets/|/frontend/|/tests/|/docs/'; then exit 1; fi
          cat > /tmp/v084-notes.md <<'NOTES'
          ## v0.8.4 — 工具权限、CLI 额度、每日用量与 1.5.18 只读内置工具适配（#38 / #41）

          - 新增 WebUI「工具权限」独立页签（`setup/tool-policy`）、官方 CLI 账号额度查询（`setup/quota-refresh` / `monitor/quota`）与本地每日用量热力图（`monitor/daily/*`），精简权限页说明、汉化额度标签并增加未就绪引导条。
          - 重构 `/agy help|setup|use|quota|usage|cost|doctor|status|models` 私聊输出为简洁中文可读文本，时间转为宿主机本地格式并修复非管理员权限边界。
          - 完成官方 CLI `1.5.18`（ACP）实测调研：新增统一内置工具注册表并覆盖 `edit_file` 与 1.5.18 调度/子代理工具拒止；开放 `read_file` 至 Linux CLI `1.5.17`/`1.5.18`（含 `StartLine`/`EndLine`/`ByteOffset` 校验，禁止 `file:///` URI）；解除对宿主 MCP 非空的依赖并修复非搜索内置工具误报联网搜索提示。

          完整改动见 [PR #39](https://github.com/sl251/astrbot_plugin_antigravity_acp/pull/39)、[PR #42](https://github.com/sl251/astrbot_plugin_antigravity_acp/pull/42)、[Issue #38](https://github.com/sl251/astrbot_plugin_antigravity_acp/issues/38)、[Issue #41](https://github.com/sl251/astrbot_plugin_antigravity_acp/issues/41) 和 [CHANGELOG](https://github.com/sl251/astrbot_plugin_antigravity_acp/blob/v0.8.4/CHANGELOG.md)。
          Windows / Ubuntu CI 与 `xiaoyu`（CLI `1.5.18`）实机冒烟通过后发布；支持 AstrBot `>=4.29.4,<4.30`、Python 3.11+。可回退至 `v0.8.3`。
          NOTES
          printf '\nCI: %s/%s/actions/runs/%s\n\nSHA-256: %s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(sha256sum "$asset" | cut -d' ' -f1)" >> /tmp/v084-notes.md
          gh release create v0.8.4 "$asset" --target "$GITHUB_SHA" --title "v0.8.4" --notes-file /tmp/v084-notes.md --latest
