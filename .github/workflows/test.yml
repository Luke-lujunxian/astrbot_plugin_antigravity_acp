name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend into temporary dist
        working-directory: frontend
        run: npm run build:ci
      - name: Verify committed views/setup artifacts match build
        working-directory: frontend
        run: npm run verify:dist

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sensitive pattern scan
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_sensitive.py
      - name: Byte-compile all plugin sources
        run: python -B -m compileall -q main.py agy_provider tests
      - name: Offline Python regressions
        run: python -m unittest discover -s tests -v
      - name: Setup view interaction regressions
        run: node --test tests/setup.test.mjs
