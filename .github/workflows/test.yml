name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend into temporary dist
        working-directory: frontend
        run: npm run build:ci
      - name: Verify committed views/setup artifacts match build
        working-directory: frontend
        run: npm run verify:dist

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sensitive pattern scan
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_sensitive.py
      - name: Byte-compile all plugin sources
        run: python -B -m compileall -q main.py agy_provider tests
      - name: Offline Python regressions
        run: python -m unittest discover -s tests -v
      - name: Setup view interaction regressions
        run: node --test tests/setup.test.mjs

  # One-shot v0.8.0 release, only after the exact release-preparation push passes CI.
  release_v080:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'chore(release): prepare v0.8.0'
    needs: [frontend, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package and publish v0.8.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version: 0.8.0' metadata.yaml
          grep -Fx 'PLUGIN_VERSION = "0.8.0"' agy_provider/_version.py
          asset=astrbot_plugin_antigravity_acp_v0.8.0.zip
          git archive --format=zip --prefix=astrbot_plugin_antigravity_acp/ -o "$asset" "$GITHUB_SHA"
          unzip -t "$asset"
          cat > /tmp/v080-notes.md <<'NOTES'
          ## v0.8.0
          
          - 原生 Dashboard 六模块重构（Vue 3 / Vuetify 3 / TypeScript）。
          - 默认模型路由核对、当前输入与历史分离、历史图片预算修复。
          - 安全 fallback 边界、CLI 告警过滤与持久脱敏失败诊断。
          
          完整改动：[PR #34](https://github.com/sl251/astrbot_plugin_antigravity_acp/pull/34)、[CHANGELOG](https://github.com/sl251/astrbot_plugin_antigravity_acp/blob/v0.8.0/CHANGELOG.md)。
          
          本发布由 Linux/Windows 前端构建一致性检查及 Python 3.11/3.12 回归门控。旧 DOM 测试不覆盖新版交互；真实 CLI、宿主 iframe、QQ、生产与视觉验收仍待 #31。#32 §5 延期。支持 AstrBot >=4.29.4,<4.30、Python 3.11+；升级前备份配置，回退使用 v0.7.5。
          NOTES
          printf '\nCI: %s/%s/actions/runs/%s\n\nSHA-256: %s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(sha256sum "$asset" | cut -d' ' -f1)" >> /tmp/v080-notes.md
          gh release create v0.8.0 "$asset" --target "$GITHUB_SHA" --title "v0.8.0" --notes-file /tmp/v080-notes.md --latest
