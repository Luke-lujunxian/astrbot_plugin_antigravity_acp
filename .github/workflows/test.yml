name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sensitive pattern scan
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_sensitive.py
      - name: Byte-compile all plugin sources
        run: python -B -m compileall -q main.py agy_provider tests
      - name: Offline Python regressions
        run: python -m unittest discover -s tests -v
      - name: Setup view syntax
        run: node --check views/setup/app.js
      - name: Setup view interaction regressions
        run: node --test tests/setup.test.mjs

  release_v086:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: v0.8.6 late tool results after timeout & max-step finalization'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package and publish v0.8.6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version: 0.8.6' metadata.yaml
          grep -Fx 'PLUGIN_VERSION = "0.8.6"' agy_provider/_version.py
          asset=astrbot_plugin_antigravity_acp_v0.8.6.zip
          git archive --format=zip --prefix=astrbot_plugin_antigravity_acp/ -o "$asset" "$GITHUB_SHA"
          unzip -t "$asset"
          for f in index.html app.js style.css; do unzip -Z1 "$asset" | grep -Fx "astrbot_plugin_antigravity_acp/views/setup/$f"; done
          if unzip -Z1 "$asset" | grep -E '/views/setup/assets/|/frontend/|/tests/|/docs/'; then exit 1; fi
          cat > /tmp/v086-notes.md <<'NOTES'
          ## v0.8.6 — 工具执行超时后的迟到结果重建与步数收尾修复（#45 / #46）

          - 宿主工具执行超过 `tool_execution_timeout` 后，晚带回的闭合工具结果不再被当作过期回填抛 `TOOL_STALE`。原 ACP 会话仍存活、同一宿主运行、历史前缀与原工具调用完全匹配且结果未提交过时，结果按文本历史送入一次无工具生成，得到基于已完成工具的回答。
          - 任一条件不满足时返回 `TOOL_TIMEOUT`（禁止重试与 fallback），不再误报「进程重载」；真正的进程重载或过期回填仍返回 `TOOL_STALE`。
          - 跑满 `max_steps` 后的收尾请求以文本历史重建、不带工具，不再抛 `TOOL_CONTEXT`；跨运行、改写或重复的回填仍被拒绝。

          [Issue #45](https://github.com/sl251/astrbot_plugin_antigravity_acp/issues/45) · [PR #46](https://github.com/sl251/astrbot_plugin_antigravity_acp/pull/46) · [PR CI](https://github.com/sl251/astrbot_plugin_antigravity_acp/actions/runs/45871142042)

          PR #46 的 Ubuntu/Windows × Python 3.11/3.12 CI 全部通过；另用 AstrBot 4.29.4 的 runner 原文离线跑同一套 372 项通过，并已在一台 Linux Docker / AstrBot 4.29.4 实机部署、webchat 一轮验证。线上触发该问题的长工具场景未在实机复现；当时「插件记录为不允许 fallback、宿主仍切到 fallback」的差异尚未查明。支持 AstrBot >=4.29.4,<4.30、Python 3.11+；可回退 v0.8.5，无新增配置或数据迁移。
          NOTES
          printf '\nCI: %s/%s/actions/runs/%s\n\nSHA-256: %s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(sha256sum "$asset" | cut -d' ' -f1)" >> /tmp/v086-notes.md
          gh release create v0.8.6 "$asset" --target "$GITHUB_SHA" --title "v0.8.6" --notes-file /tmp/v086-notes.md --latest
